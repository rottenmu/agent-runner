<script>
(function () {
  var frame = document.getElementById('frame')
  var sidebar = document.getElementById('sidebar')

  document.getElementById('toggleTheme').addEventListener('click', function () {
    if (document.body.hasAttribute('data-ds-dark-theme')) document.body.removeAttribute('data-ds-dark-theme')
    else document.body.setAttribute('data-ds-dark-theme', '')
  })

  document.getElementById('toggleSidebar').addEventListener('click', function () {
    if (sidebar.hasAttribute('data-collapsed')) {
      sidebar.removeAttribute('data-collapsed')
      frame.removeAttribute('data-sidebar-collapsed')
    } else {
      sidebar.setAttribute('data-fading', '')
      setTimeout(function () {
        sidebar.setAttribute('data-collapsed', '')
        sidebar.removeAttribute('data-fading')
        frame.setAttribute('data-sidebar-collapsed', '')
      }, 150)
    }
  })

  var draft = document.getElementById('draft')
  var composer = document.getElementById('composer')
  function syncEmpty() {
    if (draft.textContent.trim() === '') composer.setAttribute('data-empty', '')
    else composer.removeAttribute('data-empty')
  }
  draft.addEventListener('input', syncEmpty)
  syncEmpty()
})()
</script>
